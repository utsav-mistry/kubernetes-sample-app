apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-user
  namespace: sample-crud
type: kubernetes.io/basic-auth

# ==========================================================
# CNPG APPLICATION USER SECRET
#
# Used by 21-cnpg-postgres-cluster.yaml during initdb to create
# the application database owner.
#
# Also used by 05-backend-deployment.yaml so the backend connects
# with the same application username/password.
#
# Secret keys must be named username and password for this CNPG
# bootstrap configuration.
# ==========================================================
stringData:
  username: sampleuser
  password: samplepass

# Demo-only credentials. Replace with externally managed secrets
# before using this stack in a real environment.
