apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: sample-crud
spec:
  # ==========================================================
  # FRONTEND INGRESS POLICY
  #
  # Allows only the nginx gateway to reach frontend pods on port 80.
  #
  # Public users never connect to frontend pods directly. The ingress
  # terminates entry traffic at the gateway service first.
  # ==========================================================
  podSelector:
    matchLabels:
      app: frontend

  policyTypes:
    - Ingress

  ingress:
    - from:
        # Gateway serves the public app and forwards UI requests here.
        - podSelector:
            matchLabels:
              app: nginx-gateway
      ports:
        - protocol: TCP
          port: 80
