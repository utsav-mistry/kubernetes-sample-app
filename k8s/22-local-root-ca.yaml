apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-root-issuer
  namespace: sample-crud
spec:
  # ==========================================================
  # LOCAL ROOT CA BOOTSTRAP ISSUER
  #
  # This self-signed issuer exists only to create the local root CA
  # certificate below.
  #
  # It is for local trusted HTTPS, not public production TLS.
  # ==========================================================
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sample-crud-root-ca
  namespace: sample-crud
spec:
  # ==========================================================
  # LOCAL ROOT CA CERTIFICATE
  #
  # cert-manager writes the generated CA certificate and private key
  # into sample-crud-root-ca-secret.
  #
  # 23-local-ca-issuer.yaml uses that secret to sign localhost
  # certificates for the ingress.
  #
  # To trust https://localhost or https://sample-crud.local in a
  # browser, install this root CA into the OS/browser trust store.
  # ==========================================================
  isCA: true
  commonName: Sample CRUD Local Root CA
  secretName: sample-crud-root-ca-secret
  duration: 87600h
  renewBefore: 720h
  subject:
    organizations:
      - Utsav's Local Kubernetes Lab
    organizationalUnits:
      - Platform Engineering
    countries:
      - IN
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned-root-issuer
    kind: Issuer
