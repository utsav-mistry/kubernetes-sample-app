server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    location ~ /\.(git|env|svn|hg) {
        return 403;
    }

    location ~* \.(sql|bak|backup|old|log|ini|conf|yml|yaml|pem|key|crt)$ {
        return 403;
    }

    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
